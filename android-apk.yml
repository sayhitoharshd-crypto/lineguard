name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Phone-friendly: if you uploaded only lineguard-updated.zip, unpack it here.
      - name: Unpack project ZIP if needed
        run: |
          if [ ! -f package.json ]; then
            Z=$(ls lineguard*.zip 2>/dev/null | head -1)
            [ -n "$Z" ] || { echo "No package.json and no lineguard*.zip found in repo root"; exit 1; }
            unzip -q -o "$Z"
            # Handle a zip that contains a single top-level folder
            if [ ! -f package.json ]; then
              D=$(find . -maxdepth 2 -name package.json -not -path './node_modules/*' | head -1 | xargs dirname)
              cp -a "$D"/. .
            fi
          fi
          test -f package.json && test -f app.json && ls

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Metro bundle check
        run: npx expo export --platform android --output-dir /tmp/bundle-check
        env:
          CI: '1'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          SIZE=$(stat -c %s "$APK"); echo "APK size: $SIZE bytes"
          [ "$SIZE" -gt 5000000 ] || { echo "APK suspiciously small"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "package: name='com.arshdxr.lineguard'"
          cp "$APK" LineGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LineGuard-apk
          path: LineGuard.apk
          if-no-files-found: error

      # Direct-download link that works well from a phone browser
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LineGuard build ${{ github.run_number }}
          files: LineGuard.apk
